name: build-images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/agent/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-images-digitalcompanion-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: digitalcompanion-dev
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"

      - name: Set image tag
        id: meta
        run: echo "tag=v0.1.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.TENANT_NAME }}-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.TENANT_NAME }}-agent:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Summary
        run: |
          {
            echo "Pushed ARM64 images:"
            echo "- \`${{ vars.ECR_REGISTRY }}/${{ vars.TENANT_NAME }}-api:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ vars.ECR_REGISTRY }}/${{ vars.TENANT_NAME }}-agent:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
