name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Validate Postgres schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion_dev
          POSTGRES_DB: digitalcompanion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://companion:companion_dev@localhost:5432/digitalcompanion

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migration and seed
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0001_init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed.sql

      - name: Exercise the store SQL
        run: pnpm --filter @companion/api exec tsx scripts/db-smoke.ts

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: digitalcompanion-api:ci

      - name: Smoke-test API image
        run: |
          set +e
          docker run -d --name dc-api -p 4000:4000 -e API_PORT=4000 digitalcompanion-api:ci
          sleep 2
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused http://localhost:4000/health
          status=$?
          echo "--- container status ---"
          docker inspect dc-api --format '{{.State.Status}} exit={{.State.ExitCode}}'
          echo "--- container logs ---"
          docker logs dc-api
          docker rm -f dc-api >/dev/null 2>&1
          exit $status

      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent/Dockerfile
          push: false
          load: true
          tags: digitalcompanion-agent:ci

      - name: Smoke-test agent image loads
        run: |
          set +e
          output=$(docker run --rm digitalcompanion-agent:ci 2>&1)
          status=$?
          echo "$output"
          echo "exit=$status"
          # With no env it must reach our own config check, not crash on a
          # missing native module or a broken bundle.
          if [ "$status" -eq 0 ]; then exit 1; fi
          echo "$output" | grep -q "missing environment variables" || exit 1
