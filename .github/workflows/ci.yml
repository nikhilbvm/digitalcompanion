name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: digitalcompanion-api:ci

      - name: Smoke-test API image
        run: |
          docker run -d --name dc-api -p 4000:4000 -e API_PORT=4000 digitalcompanion-api:ci
          curl -fsS --retry 20 --retry-delay 1 --retry-connrefused http://localhost:4000/health
          docker logs dc-api
          docker rm -f dc-api

      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent/Dockerfile
          push: false
          tags: digitalcompanion-agent:ci
